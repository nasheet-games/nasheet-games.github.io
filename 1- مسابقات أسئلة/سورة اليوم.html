function palette() {
  openModal(`<div class="modal palette" role="dialog" aria-label="بحث سريع">
    <div class="search">${icon("search")}<input id="pq" placeholder="اكتب اسم سورة أو محطة أو أمر…" autocomplete="off"><kbd>Esc</kbd></div>
    <div class="list" id="plist" role="listbox"></div></div>`);
  const all = commands(); let sel = 0, shown = all;
  const draw = () => {
    const q = strip($("#pq").value).split(/\s+/).filter(Boolean);
    shown = all.filter((c) => q.every((w) => strip(c.t + " " + (c.d || "") + " " + c.g).includes(w)));
    sel = Math.min(sel, Math.max(0, shown.length - 1));
    let last = "";
    $("#plist").innerHTML = shown.length ? shown.map((c, i) => {
      const gh = c.g !== last ? `<div class="grp">${(last = c.g)}</div>` : "";
      return gh + `<button class="mi ${i === sel ? "act" : ""}" role="option" data-pi="${i}">${icon(c.ic)}<span>${c.t}${c.d ? `<br><small style="color:var(--ink2);font:400 13px var(--f-body)">${c.d}</small>` : ""}</span>${c.k ? `<kbd>${c.k}</kbd>` : ""}</button>`;
    }).join("") : `<div class="empty">ما لقيت شيء… جرّب كلمة ثانية</div>`;
    $("#plist .act")?.scrollIntoView({ block: "nearest" });
  };
  const run = (i) => { const c = shown[i]; if (c) { closeModal(); c.run(); } };
  $("#pq").addEventListener("input", () => { sel = 0; draw(); });
  $("#pq").addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); sel = (sel + 1) % Math.max(1, shown.length); draw(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); sel = (sel - 1 + shown.length) % Math.max(1, shown.length); draw(); }
    else if (e.key === "Enter") { e.preventDefault(); run(sel); }
  });
  $("#plist").addEventListener("click", (e) => { const b = e.target.closest("[data-pi]"); if (b) run(+b.dataset.pi); });
  draw();
}

const tip = $("#tip");
let tipEl = null;
document.addEventListener("pointerover", (e) => {

document.addEventListener("pointerdown", hideTip);

/* ═════════════ أوامر عامة ═════════════ */
function pick(n) { S.surah = n; S.focusMedal = DATA.findIndex((s) => s.n === n); Sound.play("pop"); go("setup"); }
function toggleSound() { S.set.sound = !S.set.sound; saveSet(); renderSoundBtn(); toast(S.set.sound ? "الصوت شغّال" : "الصوت مكتوم"); if (S.set.sound) Sound.play("tap"); }
function toggleTheme() { S.set.theme = S.set.theme === "night" ? "day" : "night"; document.documentElement.dataset.theme = S.set.theme; saveSet(); requestAnimationFrame(drawLines); }
function fullscreen() { if (document.fullscreenElement) document.exitFullscreen?.(); else document.documentElement.requestFullscreen?.().catch(() => toast("المتصفح منع ملء الشاشة")); }
function startGame() { if (!S.set.axes.length) return toast("اختر محطة واحدة على الأقل"); newGame(S.surah); S.sel = 0; Sound.play("station"); go("map"); }
function setTeams(d) {
  const t = S.set.teams, n = Math.max(1, Math.min(6, t.length + d));
  while (t.length < n) { const used = t.map((x) => x.color); t.push({ name: TEAM_NAMES[t.length] || `فريق ${t.length + 1}`, color: [...Array(8).keys()].find((c) => !used.includes(c)) ?? 0 }); }
  t.length = n; saveSet(); Sound.play("tap"); render();
}
function applyPreset(id) {
  const p = PRESETS.find((x) => x.id === id); if (!p) return;
  S.set.axes = [...p.axes]; S.set.preset = id; if (p.per) S.set.per = p.per; saveSet(); render();
}

/* ═════════════ النقرات ═════════════ */
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) { if (S.ui.pop && !e.target.closest("#pop")) closePop(); return; }
  if (S.ui.pop && !b.closest("#pop") && b !== S.ui.pop.anchor) closePop();
  const a = b.dataset.act, g = S.game;
  switch (a) {
    case "home": go("home"); break;
    case "pick": pick(+b.dataset.n); break;
    case "random": pick(DATA[(Math.random() * DATA.length) | 0].n); break;
    case "resume": S.game = load(KEY_GAME, null); S.surah = S.game.n; S.sel = nextStation(); go("map"); break;
    case "discard": localStorage.removeItem(KEY_GAME); S.game = null; render(); break;
    case "teams": setTeams(+b.dataset.d); break;
    case "color": {
      const i = +b.dataset.i, cur = S.set.teams[i].color;
      openPop(b, `<div class="swatches">${TEAM_COLORS.map((c, j) => `<button data-v="${j}" style="--c:${c}" aria-pressed="${j === cur}" aria-label="لون ${j + 1}"></button>`).join("")}</div>`, (v) => { S.set.teams[i].color = +v; saveSet(); render(); });
      break;
    }
    case "preset": openPop(b, PRESETS.map((p) => `<button class="mi" data-v="${p.id}">${icon(p.id === "quick" ? "next" : p.id === "hifz" ? "puzzle" : p.id === "fahm" ? "seed" : "map")}<span>${p.name}<br><small style="color:var(--ink2);font:400 13px var(--f-body)">${p.desc}</small></span>${S.set.preset === p.id ? '<span class="check">✓</span>' : ""}</button>`).join(""), applyPreset); break;
    case "axis": {
      const id = b.dataset.a, ax = S.set.axes;
      S.set.axes = ax.includes(id) ? ax.filter((x) => x !== id) : AXES.map((x) => x.id).filter((x) => ax.includes(x) || x === id);
      S.set.preset = (PRESETS.find((p) => p.axes.length === S.set.axes.length && p.axes.every((x) => S.set.axes.includes(x))) || { id: "custom" }).id;
      saveSet(); Sound.play("tap"); render(); break;
    }
    case "per": S.set.per = +b.dataset.v; S.set.preset = PRESETS.find((p) => p.id === S.set.preset) ? S.set.preset : "custom"; saveSet(); render(); break;
    case "timer": S.set.timer = +b.dataset.v; saveSet(); render(); break;
    case "lifelines": S.set.lifelines = !S.set.lifelines; saveSet(); render(); break;
    case "start": startGame(); break;
    case "map": if (g) { S.sel = nextStation(); go("map"); } break;
    case "station": S.sel = +b.dataset.i; enterStation(+b.dataset.i); break;
    case "enter": enterStation(nextStation()); break;
    case "finish": go("end"); break;
    case "begin": g.stations[g.cur].introSeen = true; saveGame(); go("q"); break;
    case "answer": answer(+b.dataset.i); break;
    case "next": nextQ(); break;
    case "life": useLife(b.dataset.k); break;
    case "mw": matchPick("w", +b.dataset.w); break;
    case "mm": matchPick("m", +b.dataset.m); break;
    case "strip": orderPick(+b.dataset.i); break;
    case "adj": addScore(+b.dataset.t, +b.dataset.d, b); break;
    case "again": newGame(S.surah || g.n); S.sel = 0; go("map"); break;
    case "palette": palette(); break;
    case "sound": toggleSound(); break;
    case "menu": openPop(b, menuHTML(), (v) => ({ home: () => go("home"), map: () => { S.sel = nextStation(); go("map"); }, finish: () => go("end"), sound: toggleSound, theme: toggleTheme, full: fullscreen, keys: keysModal, about: aboutModal })[v]?.()); break;
    case "close": closeModal(); break;
  }
});
document.addEventListener("input", (e) => {
  const i = e.target.dataset?.team; if (i === undefined) return;
  S.set.teams[+i].name = e.target.value.trim() || TEAM_NAMES[+i] || "فريق"; saveSet();
});

/* ═════════════ لوحة المفاتيح ═════════════ */
const digit = (e) => { const m = /^(Digit|Numpad)(\d)$/.exec(e.code); return m ? +m[2] : null; };
document.addEventListener("keydown", (e) => {
  const typing = e.target.matches?.("input, textarea");
  if ((e.ctrlKey || e.metaKey) && e.code === "KeyK") { e.preventDefault(); S.ui.modal ? closeModal() : palette(); return; }
  if (e.key === "Escape") {
    if (S.ui.modal) return closeModal();
    if (S.ui.pop) return closePop();
    if (typing) return e.target.blur();
    if (S.screen === "setup") return go("home");
    if (S.screen === "q" || S.screen === "intro") { S.sel = nextStation(); return go("map"); }
    if (S.screen === "map" || S.screen === "end") return go("home");
    return;
  }
  if (S.ui.modal || typing) return;
  if (S.ui.pop) return;
  const g = S.game, d = digit(e), scr = S.screen;

  if (g && d && d >= 1 && d <= g.teams.length && (e.shiftKey || e.altKey) && ["map", "q", "intro"].includes(scr)) { e.preventDefault(); addScore(d - 1, e.shiftKey ? 10 : -10); return; }
  if (e.key === "?" || (e.shiftKey && e.code === "Slash")) { e.preventDefault(); return keysModal(); }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === "KeyF") return fullscreen();
  if (e.code === "KeyM") return toggleSound();
  if (e.code === "KeyN") return toggleTheme();

  if (scr === "home") {
    const m = $$(".medal"); const i = m.indexOf(document.activeElement);
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); const dir = e.key === "ArrowLeft" ? 1 : -1; const n = ((i < 0 ? -dir : i) + dir + m.length) % m.length; m[n].focus(); S.focusMedal = n; Sound.play("tap"); }
    else if (e.code === "KeyR") pick(DATA[(Math.random() * DATA.length) | 0].n);
    else if (e.code === "KeyH") go("home");
    return;
  }
  if (scr === "setup") {
    if (e.key === "Enter" && !e.target.closest("button")) { e.preventDefault(); startGame(); }
    else if (e.key === "+" || e.code === "Equal" || e.code === "NumpadAdd") setTeams(1);
    else if (e.key === "-" || e.code === "Minus" || e.code === "NumpadSubtract") setTeams(-1);
    else if (e.code === "KeyH") go("home");
    return;
  }
  if (scr === "map") {
    const n = g.stations.length;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "ArrowUp" || e.key === "ArrowDown") {
      e.preventDefault(); S.sel = (S.sel + (e.key === "ArrowLeft" || e.key === "ArrowDown" ? 1 : -1) + n) % n;
      $$(".node").forEach((x, i) => x.classList.toggle("sel", i === S.sel)); $$(".node")[S.sel].focus({ preventScroll: true }); Sound.play("tap");
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (document.activeElement?.classList.contains("node")) enterStation(+document.activeElement.dataset.i);
      else if (nextStation() < 0) go("end"); else enterStation(S.sel >= 0 ? S.sel : nextStation());
    } else if (e.code === "KeyH") go("home");
    return;
  }
  if (scr === "intro") { if (e.key === "Enter" || e.code === "Space") { e.preventDefault(); g.stations[g.cur].introSeen = true; saveGame(); go("q"); } return; }
  if (scr === "end") { if (e.key === "Enter") { e.preventDefault(); go("home"); } else if (e.code === "KeyH") go("home"); return; }
  if (scr === "q") {
    const q = curQ();
    if (e.key === "Enter") { e.preventDefault(); if (g.answered) nextQ(); else if (document.activeElement?.dataset?.act) document.activeElement.click(); return; }
    if (e.code === "Space") { e.preventDefault(); if (!g.answered) skipReveal(); return; }
    if (e.code === "KeyX") return useLife("fifty");
    if (e.code === "KeyH") return useLife("hint");
    if (e.code === "KeyD") return useLife("double");
    if (e.code === "KeyP") return togglePause();
    if (e.code === "KeyT" && g.teams.length > 1 && !g.answered) { g.turn = (g.turn + 1) % g.teams.length; saveGame(); renderDock(); const t = $(".turn"); if (t) { t.style.setProperty("--tc", g.teams[g.turn].color); t.querySelector("b").textContent = g.teams[g.turn].name; } toast(`الدور الآن على ${esc(g.teams[g.turn].name)}`, g.teams[g.turn].color); return; }
    if (e.key === "+" || e.code === "Equal" || e.code === "NumpadAdd") return addScore(g.turn, 5);
    if (e.key === "-" || e.code === "Minus" || e.code === "NumpadSubtract") return addScore(g.turn, -5);
    if (e.key === "Backspace") { e.preventDefault(); return orderUndo(); }
    if (d) {
      if (q.type === "match") { if (d >= 1 && d <= q.pairs.length) matchPick("w", d - 1); else if (d >= 5 && d < 5 + q.pairs.length) matchPick("m", q.mOrder[d - 5]); return; }
      if (q.type === "order") return orderPick(d - 1);
      if (d >= 1 && d <= (q.opts?.length || 0)) answer(d - 1);
    }
  }
});

/* ═════════════ الخلفية المرسومة + حياة خفيفة ═════════════ */
(function scenery() {
  // الاسم المرسوم نفسه اللي على الغلاف، أعلى كل الشاشات
  if (ART.title) $(".brand").innerHTML = `${ART.logo ? spr(ART.logo, "brand-logo") : ""}${spr(ART.title, "brand-title")}<span class="sr">سورة اليوم</span>`;
  if (!ART.bg) return;
  document.body.classList.add("has-art");
  const bg = document.createElement("div"); bg.id = "skbg"; bg.setAttribute("aria-hidden", "true");
  bg.innerHTML = '<i class="crisp"></i><i class="soft"></i>';
  bg.children[0].style.backgroundImage = `url(${ART.bg})`;            // مباشرة على العنصر (بدون متغير CSS موروث)
  bg.children[1].style.backgroundImage = `url(${ART.bgSoft || ART.bg})`;
  document.body.prepend(bg);
  // ٤ لمعات صغيرة تطفو ببطء (transform/opacity فقط)، ٢ على الأجهزة الضعيفة، ولا شيء مع «تقليل الحركة»
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const weak = (navigator.hardwareConcurrency || 4) <= 2 || (navigator.deviceMemory || 4) <= 2;
  const life = document.createElement("div"); life.id = "sklife"; life.setAttribute("aria-hidden", "true");
  life.innerHTML = Array.from({ length: weak ? 2 : 4 }, (_, i) => `<i style="left:${(8 + i * 24 + Math.random() * 10).toFixed(1)}%;animation-duration:${(16 + Math.random() * 8).toFixed(1)}s;animation-delay:${(-Math.random() * 18).toFixed(1)}s"></i>`).join("");
  bg.after(life);
  // توقف الحركة الخلفية إذا انفتحت نافذة
  const m = $("#modal"); new MutationObserver(() => document.body.classList.toggle("sk-ov", !m.hidden)).observe(m, { attributes: true, attributeFilter: ["hidden"] });
})();

/* ═════════════ البداية ═════════════ */
document.documentElement.dataset.theme = S.set.theme;
document.fonts?.ready.then(() => drawLines());
go("home");
})();
</script>
